<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astra · First launch</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #03050b; color: #fff4e9; overflow: hidden; }
  #stage { position: absolute; inset: 0; overflow: hidden; isolation: isolate; }
  #space { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 62%, #142036, #080e1a 43%, #03050b 76%); }
  #stars, #world, #orbit, #veil { position: absolute; inset: 0; width: 100%; height: 100%; }
  #world { display: block; }
  #veil { background: #0a0d17; }
  #signature {
    position: absolute; top: 43%; left: 50%; transform: translateX(-50%);
    width: 100%; text-align: center; font: 500 min(7.2vw, 4.1vh) / 1.05 "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -0.055em;
  }
  #signature small {
    display: block; margin-top: .85em; padding-left: .28em; font-size: .28em;
    font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: #d5b8a8;
  }
  #replay {
    position: absolute; right: 16px; bottom: 16px; background: #0a0d17; color: #fff4e9;
    border: 1px solid #b28a75; border-radius: 6px; padding: 8px 12px; cursor: pointer;
  }
  #replay[hidden] { display: none; }
</style>
<script type="importmap">
  {"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<div id="stage">
  <div id="space"></div>
  <svg id="stars" viewBox="0 0 720 1280" preserveAspectRatio="none" aria-hidden="true"></svg>
  <canvas id="world"></canvas>
  <svg id="orbit" viewBox="0 0 720 1280" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="trace-color" x1="0" x2="1" y1="1" y2="0">
        <stop stop-color="#627fae" stop-opacity="0"/>
        <stop offset=".52" stop-color="#8cadd9" stop-opacity=".65"/>
        <stop offset="1" stop-color="#ffc09a"/>
      </linearGradient>
      <radialGradient id="ember">
        <stop stop-color="#ffc8a4" stop-opacity=".55"/>
        <stop offset=".38" stop-color="#e89570" stop-opacity=".19"/>
        <stop offset="1" stop-color="#e89570" stop-opacity="0"/>
      </radialGradient>
      <path id="astra-star" d="M12 1.5C12.9 8 16 11.1 22.5 12 16 12.9 12.9 16 12 22.5 11.1 16 8 12.9 1.5 12 8 11.1 11.1 8 12 1.5Z"/>
    </defs>
    <path id="trace" d="M-22 733 C100 622 206 527 360 468" fill="none" stroke="url(#trace-color)" stroke-width="1.4" pathLength="1"/>
    <g id="signal">
      <circle r="31" fill="url(#ember)"/>
      <circle id="dot" r="3.8" fill="#fff0df"/>
      <use id="star" href="#astra-star" fill="#ffcca9"/>
    </g>
  </svg>
  <div id="veil"></div>
  <div id="signature">Astra<small>Care beyond Earth</small></div>
  <button id="replay" hidden>Replay</button>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const duration = 2.6;
const exporting = new URLSearchParams(location.search).has('export');
const element = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ canvas: element('world'), alpha: true, antialias: true });
renderer.setPixelRatio(exporting ? 1 : Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 9 / 16, 0.02, 20);
const sunDirection = new THREE.Vector3(-0.65, 0.72, 0.31).normalize();
const sunlight = new THREE.DirectionalLight(0xffdec9, 2.4);
sunlight.position.copy(sunDirection);
scene.add(sunlight, new THREE.AmbientLight(0x80a9ec, 0.11));

const { scene: earth } = await new GLTFLoader().loadAsync('./assets/models/earth.glb');
const bounds = new THREE.Box3().setFromObject(earth);
const size = bounds.getSize(new THREE.Vector3());
const globe = new THREE.Group();
earth.position.sub(bounds.getCenter(new THREE.Vector3()));
globe.add(earth);
globe.scale.setScalar(2 / Math.max(size.x, size.y, size.z));
earth.traverse(object => {
  if (object.isMesh) object.material.normalScale.setScalar(0.32);
});
scene.add(globe);

const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.024, 96, 64),
  new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { sun: { value: sunDirection } },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vWorld;
      void main() {
        vNormal = normalize(mat3(modelMatrix) * normal);
        vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * viewMatrix * vec4(vWorld, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 sun;
      varying vec3 vNormal;
      varying vec3 vWorld;
      void main() {
        vec3 n = normalize(vNormal);
        float facing = max(dot(n, normalize(cameraPosition - vWorld)), 0.0);
        float rim = pow(1.0 - facing, 5.5);
        float day = smoothstep(-0.08, 0.88, dot(n, sun));
        vec3 tint = mix(vec3(0.12, 0.30, 0.66), vec3(0.43, 0.63, 1.0), day);
        gl_FragColor = vec4(tint, rim * (0.05 + day * 0.75));
        #include <colorspace_fragment>
      }`,
  }),
);
scene.add(atmosphere);

let seed = 29;
function random() {
  seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
  return seed / 4294967296;
}
for (let index = 0; index < 83; index++) {
  const point = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  point.setAttribute('cx', random() * 720);
  point.setAttribute('cy', random() * 1280);
  point.setAttribute('r', 0.28 + random() * 0.78);
  point.setAttribute('opacity', 0.10 + random() * 0.43);
  point.setAttribute('fill', index % 6 === 0 ? '#ecc9a9' : '#c2d5f4');
  element('stars').append(point);
}

const trace = element('trace');
const traceLength = trace.getTotalLength();
const signal = element('signal');
const dot = element('dot');
const star = element('star');
const veil = element('veil');
const signature = element('signature');
const orbit = element('orbit');
const stage = element('stage');
const world = element('world');
const stars = element('stars');
const clamp = value => Math.max(0, Math.min(value, 1));
function ease(t, start, end) {
  const x = clamp((t - start) / (end - start));
  return x * x * (3 - 2 * x);
}

function resize() {
  const height = innerHeight;
  const width = exporting ? innerWidth : Math.min(innerWidth, height * 9 / 16);
  stage.style.width = width + 'px';
  stage.style.left = (innerWidth - width) / 2 + 'px';
  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

window.D = duration;
window.render = t => {
  const drift = ease(t, 0, 2);
  camera.position.set(-0.23 + drift * 0.31, 0.98 + drift * 0.12, 3.13 - drift * 0.13);
  camera.lookAt(0.13, 0.94 + drift * 0.18, 0);
  globe.rotation.set(0.14, 0.85 + drift * 0.21, -0.17);
  renderer.render(scene, camera);

  const entry = 0.48 + 0.52 * ease(t, 0, 0.58);
  world.style.opacity = entry * (1 - 0.79 * ease(t, 1.44, 2.26));
  stars.style.opacity = 1 - 0.55 * ease(t, 1.42, 2.24);
  const progress = ease(t, 0.19, 1.55);
  const point = trace.getPointAtLength(progress * traceLength);
  signal.setAttribute('transform', `translate(${point.x} ${point.y})`);
  orbit.style.opacity = ease(t, 0.19, 0.48);
  trace.style.strokeDasharray = `${progress} 1`;
  trace.style.opacity = 1 - ease(t, 1.25, 1.89);
  const bloom = ease(t, 1.48, 1.87);
  dot.style.opacity = 1 - bloom;
  const starScale = 0.42 + bloom * 2.04;
  star.setAttribute('transform', `scale(${starScale}) translate(-12 -12)`);
  star.style.opacity = bloom;
  veil.style.opacity = 0.23 * ease(t, 1.4, 2.2);
  const title = ease(t, 1.6, 2.18);
  signature.style.opacity = title;
  signature.style.transform = `translate(-50%, ${(1 - title) * 10}px)`;
};
window.ready = true;
window.render(0);

if (!exporting) {
  const replay = element('replay');
  const play = () => {
    replay.hidden = true;
    const start = performance.now();
    const frame = now => {
      const time = Math.min(duration, (now - start) / 1000);
      window.render(time);
      if (time < duration) requestAnimationFrame(frame);
      else replay.hidden = false;
    };
    requestAnimationFrame(frame);
  };
  replay.addEventListener('click', play);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    window.render(duration);
    replay.hidden = false;
  } else play();
}
</script>
</body>
</html>
