<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astra Launch Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Astra launch ad v2 — 9:16 (1080×1920).
  A 3D camera rig per scene (orbit, push-in, whip pans with motion blur, cube turn), a mouse cursor that clicks
  through six different app interfaces, and a colour mesh background that shifts palette scene by scene.
  Everything is a pure function of time: render(t). Export with `node render.mjs` (see render.mjs).
  ?export → bare 1080×1920 stage, no controls.
-->
<style>
  :root { --ui-bg: #F3EEEA; --ui-fg: #2B1E18; --ui-card: #ffffff; --ui-line: #E4D9D2; --copper: #B8693F; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ui-bg: #120E14; --ui-fg: #F1EAF2; --ui-card: #211A24; --ui-line: #3A2F3E; } }
  :root[data-theme="dark"] { --ui-bg: #120E14; --ui-fg: #F1EAF2; --ui-card: #211A24; --ui-line: #3A2F3E; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--ui-bg); color: var(--ui-fg); font-family: 'Inter Tight', system-ui, sans-serif; overflow: hidden;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  body.export { background: #000; display: block; }
  #holder { position: relative; flex: none; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 80px -30px rgba(40,20,60,.5); }
  body.export #holder { border-radius: 0; box-shadow: none; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; background: #fff;
           color: #1E1830; font-family: 'Inter Tight', system-ui, sans-serif; }

  .scene { position: absolute; inset: 0; display: none; perspective: 1700px; perspective-origin: 50% 46%; }
  .cam { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 50%; will-change: transform; }
  .p3 { transform-style: preserve-3d; }
  .abs { position: absolute; }
  .c { position: absolute; transform: translate(-50%, -50%); }
  .row { display: flex; align-items: center; }
  .nw { white-space: nowrap; }
  svg.i { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .panel { position: absolute; transform-style: preserve-3d; background: rgba(255,255,255,.94); border-radius: 60px;
           box-shadow: 0 70px 140px -50px rgba(30,15,60,.55), inset 0 0 0 2px rgba(255,255,255,.85); }
  .shadow { position: absolute; border-radius: 50%; background: rgba(20,10,40,.35); filter: blur(60px); }
  .gtext { -webkit-background-clip: text; background-clip: text; color: transparent; }
  .chip { position: absolute; display: flex; align-items: center; gap: 12px; border-radius: 999px; padding: 16px 28px; font-size: 32px; font-weight: 600; white-space: nowrap; }
  .btn { position: absolute; display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .tile { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 30px; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }

  /* controls (not part of the video) */
  #ui { display: flex; align-items: center; gap: 12px; width: min(560px, calc(100vw - 32px)); background: var(--ui-card); border: 1px solid var(--ui-line);
        border-radius: 18px; padding: 10px 14px; flex: none; }
  #ui button { all: unset; cursor: pointer; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--copper); color: #fff; flex: none; }
  #ui button:focus-visible { outline: 2px solid #E3B79E; outline-offset: 2px; }
  #ui input[type=range] { flex: 1; accent-color: var(--copper); min-width: 0; }
  #ui .t { font-variant-numeric: tabular-nums; font-size: 13px; opacity: .8; width: 76px; text-align: right; flex: none; }
  #scenes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; width: min(620px, calc(100vw - 32px)); flex: none; }
  #scenes button { all: unset; cursor: pointer; font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--ui-line); background: var(--ui-card); color: var(--ui-fg); }
  #scenes button.on { background: var(--copper); border-color: var(--copper); color: #fff; }
  body.export #ui, body.export #scenes { display: none; }
  @media (max-width: 600px) { body { justify-content: flex-start; gap: 10px; } #holder { border-radius: 0; box-shadow: none; } #scenes { display: none; } }
</style>
</head>
<body>
<div id="holder"><div id="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gStar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB38A"/><stop offset=".5" stop-color="#FF6A4D"/><stop offset="1" stop-color="#7B61FF"/></linearGradient>
      <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FD1A0"/><stop offset="1" stop-color="#12A594"/></linearGradient>
      <linearGradient id="gHrv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14B8A6" stop-opacity=".35"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></linearGradient>
    </defs>
  </svg>
  <svg id="mblur" width="0" height="0" style="position:absolute" aria-hidden="true"><defs></defs></svg>

  <!-- colour mesh background (palette changes per scene) -->
  <div id="bg" class="abs" style="inset:0">
    <div id="bl0" class="abs" style="width:1500px;height:1500px;left:-600px;top:-500px"></div>
    <div id="bl1" class="abs" style="width:1400px;height:1400px;left:300px;top:-300px"></div>
    <div id="bl2" class="abs" style="width:1500px;height:1500px;left:-500px;top:900px"></div>
    <div id="bl3" class="abs" style="width:1400px;height:1400px;left:350px;top:1000px"></div>
    <div id="stars" class="abs" style="inset:0"></div>
  </div>

  <section class="scene" id="s0"><div class="cam" id="cam0"></div></section>
  <section class="scene" id="s1"><div class="cam" id="cam1"></div></section>
  <section class="scene" id="s2"><div class="cam" id="cam2"></div></section>
  <section class="scene" id="s3"><div class="cam" id="cam3"></div></section>
  <section class="scene" id="s4"><div class="cam" id="cam4"></div></section>
  <section class="scene" id="s5"><div class="cam" id="cam5"></div></section>
  <section class="scene" id="s6"><div class="cam" id="cam6"></div></section>
  <section class="scene" id="s7"><div id="s7bg" class="abs" style="inset:0"></div><div class="cam" id="cam7"></div></section>
  <section class="scene" id="s8" style="background:#1C120D"><div class="cam" id="cam8"></div><div id="s8black" class="abs" style="inset:0;background:#000"></div></section>

  <div id="ripples"></div>
  <div id="cursor" class="abs" style="left:0;top:0;width:78px;height:96px;z-index:50;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))">
    <svg width="78" height="96" viewBox="0 0 26 32"><path d="M2 2 L2 25.5 L8.2 19.6 L12.4 29.4 L16.6 27.6 L12.5 18 L20.8 18 Z" fill="#14101C" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
  </div>
</div></div>

<div id="ui" role="group" aria-label="Playback">
  <button id="play" aria-label="Pause"></button>
  <input id="scrub" type="range" min="0" max="25" step="0.01" value="0" aria-label="Timeline">
  <span class="t" id="time">0.00s</span>
</div>
<div id="scenes"></div>

<script>
const D = 25;
const EXPORT = new URLSearchParams(location.search).has('export');
if (EXPORT) document.body.classList.add('export');
const $ = id => document.getElementById(id);
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p = (t, a, b) => cl((t - a) / (b - a));
const L = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x,
  out: x => 1 - Math.pow(1 - x, 3),
  in: x => x * x * x,
  expo: x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  io: x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  sine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  back: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/** Pose an element: o, x, y, z, rx, ry, rz, s, b (blur). .c elements are centred on left/top. */
function S(el, o) {
  const op = cl(o.o ?? 1);
  el.style.opacity = op;
  el.style.visibility = op <= 0.002 ? 'hidden' : 'visible';
  if (op <= 0.002) return;
  let tr = el.classList.contains('c') ? 'translate(-50%,-50%) ' : '';
  tr += `translate3d(${(o.x || 0).toFixed(2)}px,${(o.y || 0).toFixed(2)}px,${(o.z || 0).toFixed(2)}px)`;
  if (o.rx) tr += ` rotateX(${o.rx.toFixed(2)}deg)`;
  if (o.ry) tr += ` rotateY(${o.ry.toFixed(2)}deg)`;
  if (o.rz) tr += ` rotateZ(${o.rz.toFixed(2)}deg)`;
  tr += ` scale(${(o.s ?? 1).toFixed(4)})`;
  el.style.transform = tr;
  if (o.b !== undefined) el.style.filter = o.b > 0.3 ? `blur(${o.b.toFixed(1)}px)` : 'none';
}
/** Blur-in at a, blur-out at c. */
function bio(t, a, c = 1e9, d = 0.5, B = 24, dy = 30, od = 0.3, ody = -30) {
  if (t < c) { const k = E.expo(p(t, a, a + d)); return { o: p(t, a, a + d * 0.6), b: (1 - k) * B, y: (1 - k) * dy }; }
  const k = E.io(p(t, c, c + od)); return { o: 1 - k, b: k * B, y: k * ody };
}
/** Pop in with overshoot (scale) and depth. */
function pop(t, a, d = 0.45, z = 0) { const k = E.back(p(t, a, a + d)); return { o: p(t, a, a + 0.12), s: L(0.4, 1, k), z: z * cl(k, 0, 1.2) }; }

// ------------------------------------------------------------------ icons
const IC = {
  star: '<path d="M12 1.5C12.9 8 16 11.1 22.5 12 16 12.9 12.9 16 12 22.5 11.1 16 8 12.9 1.5 12 8 11.1 11.1 8 12 1.5Z"/>',
  watch: '<circle cx="12" cy="12" r="6"/><polyline points="12 10 12 12 13 13"/><path d="m16.13 7.66-.81-4.05a2 2 0 0 0-2-1.61h-2.68a2 2 0 0 0-2 1.61l-.78 4.05"/><path d="m7.88 16.36.8 4a2 2 0 0 0 2 1.61h2.72a2 2 0 0 0 2-1.61l.81-4.05"/>',
  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  flask: '<path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>',
  activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  weight: '<circle cx="12" cy="5" r="3"/><path d="M6.5 8a2 2 0 0 0-1.905 1.46L2.1 18.5A2 2 0 0 0 4 21h16a2 2 0 0 0 1.925-2.54L19.4 9.5A2 2 0 0 0 17.48 8Z"/>',
  thermo: '<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',
  eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  dumbbell: '<path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/>',
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
  send: '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
  up: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  award: '<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
};
const ic = (n, s = 40, c = 'currentColor', w = 1.9) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" style="color:${c};stroke-width:${w}">${IC[n]}</svg>`;
const star = (s, fill = 'url(#gStar)') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path fill="${fill}" d="${IC.star.match(/d="([^"]+)"/)[1]}"/></svg>`;
const html = (parent, h) => { $(parent).insertAdjacentHTML('beforeend', h); };

/** 3D app icon: gradient face + darker back layers for thickness. */
const appIcon = (id, size, left, top) => `
  <div id="${id}" class="c p3" style="left:${left}px;top:${top}px;width:${size}px;height:${size}px">
    ${[3, 2, 1].map(k => `<div class="abs" style="inset:0;border-radius:${size * 0.27}px;background:#5B2E1E;transform:translateZ(${-k * size * 0.03}px)"></div>`).join('')}
    <div class="abs" style="inset:0;border-radius:${size * 0.27}px;background:linear-gradient(140deg,#FFB38A 0%,#FF6A4D 42%,#B8693F 70%,#7B61FF 100%);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.45)">
      ${star(size * 0.56, '#fff')}
      <div class="abs" style="inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.45),rgba(255,255,255,0) 45%)"></div>
    </div>
  </div>`;

// ================================================================== SCENE 0 · cold open
html('cam0', `
  <div id="o-ring" class="c p3" style="left:540px;top:800px;width:820px;height:820px">
    <div class="abs" style="inset:0;border-radius:50%;border:3px solid rgba(123,97,255,.55);box-shadow:0 0 40px rgba(255,106,77,.35)"></div>
    <div class="abs" style="inset:110px;border-radius:50%;border:2px dashed rgba(255,106,77,.45)"></div>
  </div>
  ${appIcon('o-icon', 300, 540, 800)}
  <div id="o-word" class="c nw" style="left:540px;top:1140px;font-size:200px;font-weight:700;letter-spacing:-8px;color:#1E1830">Astra</div>
  <div id="o-tag" class="c nw" style="left:540px;top:1290px;font-size:54px;color:#4E4466">Crew health, beyond Earth.</div>`);
const PLANETS = [['#FF6A4D', 64], ['#7B61FF', 46], ['#14B8A6', 54], ['#FFB547', 38], ['#FF7AB6', 44], ['#4A90E2', 50]].map(([c, s], i) => {
  const el = document.createElement('div');
  el.className = 'c';
  el.style.cssText = `left:410px;top:410px;width:${s}px;height:${s}px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,${c} 35%,${c} 60%,rgba(0,0,0,.35) 100%);box-shadow:0 0 30px ${c}`;
  $('o-ring').appendChild(el);
  return { el, a: (i / 6) * Math.PI * 2 };
});

// ================================================================== SCENE 1 · AI chat
html('cam1', `
  <div class="shadow" style="left:160px;top:1500px;width:760px;height:200px;transform:translateZ(-220px)"></div>
  <div id="c-panel" class="panel" style="left:100px;top:360px;width:880px;height:1240px">
    <div class="abs row" style="left:40px;top:38px;gap:26px">
      <div style="width:100px;height:100px;border-radius:32px;background:linear-gradient(140deg,#FF8A5B,#7B61FF);display:flex;align-items:center;justify-content:center">${star(56, '#fff')}</div>
      <div><div style="font-size:46px;font-weight:700;letter-spacing:-1px">Astra Assistant</div>
      <div class="row" style="gap:10px;font-size:28px;color:#6B6380;margin-top:4px"><span style="width:14px;height:14px;border-radius:7px;background:#22C55E"></span>Online · knows your baseline</div></div>
    </div>
    <div class="abs" style="left:40px;right:40px;top:176px;height:2px;background:#EEEAF6"></div>
    <div id="c-ub" class="abs nw" style="right:40px;top:224px;padding:26px 36px;border-radius:44px 44px 12px 44px;background:linear-gradient(135deg,#7B61FF,#4A90E2);color:#fff;font-size:38px;font-weight:500">Why is my HRV low today?</div>
    <div id="c-dots" class="abs row" style="left:40px;top:370px;gap:12px;padding:30px 34px;border-radius:44px 44px 44px 12px;background:#F2EEFB">
      <i style="width:16px;height:16px;border-radius:8px;background:#7B61FF"></i><i style="width:16px;height:16px;border-radius:8px;background:#A08CFF"></i><i style="width:16px;height:16px;border-radius:8px;background:#C6B9FF"></i>
    </div>
    <div id="c-ai" class="abs" style="left:40px;top:370px;width:760px;padding:30px 36px;border-radius:44px 44px 44px 12px;background:#F2EEFB;font-size:37px;line-height:1.36;color:#2A2140;min-height:120px"><span id="c-aitext"></span></div>
    <div id="c-chips" class="abs p3" style="left:40px;top:690px;width:800px;height:80px"></div>
    <div id="c-sug" class="abs p3" style="left:40px;top:800px;width:800px;height:210px;border-radius:40px;background:linear-gradient(120deg,#FFF0E3,#FFE3F1);box-shadow:inset 0 0 0 2px #FFD0BC">
      <div class="abs" style="left:36px;top:34px;font-size:26px;font-weight:700;letter-spacing:2px;color:#FF6A4D">✦ SUGGESTION</div>
      <div class="abs nw" style="left:36px;top:76px;font-size:38px;font-weight:700">Wind down at 22:30</div>
      <div class="abs nw" style="left:36px;top:130px;font-size:30px;color:#6B6380">Light mobility instead of ARED today</div>
      <div id="c-add" class="btn" style="right:30px;top:62px;height:88px;padding:0 34px;font-size:32px;background:#7B61FF;color:#fff"><span id="c-addt">Add to plan</span></div>
    </div>
    <div id="c-bar" class="abs" style="left:30px;top:1090px;width:820px;height:120px;border-radius:60px;background:#fff;box-shadow:inset 0 0 0 2px #E6E0F4">
      <div id="c-input" class="abs nw" style="left:44px;top:0;height:120px;line-height:120px;font-size:38px;width:560px"><span id="c-ph" style="color:#A59DBA">Ask Astra…</span><span id="c-type"></span></div>
      <div class="abs" style="left:640px;top:38px">${ic('mic', 44, '#8E86A6')}</div>
      <div id="c-send" class="btn" style="left:716px;top:14px;width:92px;height:92px;background:linear-gradient(135deg,#7B61FF,#4A90E2);color:#fff">${ic('up', 46, '#fff', 2.6)}</div>
    </div>
  </div>`);
const CHIPS = [['Sleep −2 h', '#FFB547', '#FFF4DE', 'moon'], ['HRV −12%', '#7B61FF', '#EEEAFF', 'heart'], ['Strain high', '#FF5E6C', '#FFE7EA', 'zap']].map(([txt, c, bg, icn], i) => {
  const el = document.createElement('div');
  el.className = 'chip';
  el.style.cssText += `left:${[0, 262, 530][i]}px;top:0;background:${bg};color:${c};box-shadow:0 18px 30px -18px ${c}`;
  el.innerHTML = ic(icn, 32, c, 2.2) + `<span style="color:#2A2140">${txt}</span>`;
  $('c-chips').appendChild(el);
  return el;
});

    const pct = L(25, 50, E.out(p(t, T.check + 0.05, T.check + 0.6)));

    $('p-streakt').textContent = done ? '13-day streak' : '12-day streak';

    const kx = p(t, T.check + 0.05, T.check + 0.9);
    S($('p-xp'), { o: p(t, T.check + 0.05, T.check + 0.15) * (1 - p(t, 11.2, 11.4)), y: L(80, -140, E.expo(kx)), s: L(0.4, 1, E.back(p(t, T.check + 0.05, T.check + 0.45))), z: 240 });

      tl.wrap.style.transform = `rotateY(${tl.a}deg) translateZ(${R.toFixed(1)}px) rotateY(${(-tl.a - spin).toFixed(2)}deg) rotateX(58deg)`;

      tl.ok.style.transform = `scale(${E.back(p(t, T.connect + 0.15 + tl.i * 0.06, T.connect + 0.5 + tl.i * 0.06)).toFixed(3)})`;
      const f = ((t - T.connect - 0.1 - tl.i * 0.05) * 1.6) % 1;

    });
    S($('i-card'), { ...bio(t, 14.75, 1e9, 0.45, 18, 60), z: 40 });
    $('i-dot').style.background = con ? '#22C55E' : '#C4C9D4';
    $('i-stat').textContent = con ? 'Connected · syncing' : 'Not connected';
    $('i-connect').style.background = con ? '#22C55E' : 'linear-gradient(120deg,#FF7A45,#FF5EA8)';
    $('i-ct').textContent = con ? 'Connected ✓' : 'Connect';
    S($('i-connect'), { s: con ? L(1.18, 1, E.back(p(t, T.connect + 0.05, T.connect + 0.4))) : pressed(t, T.connect) });
  }

  // ---------- 6 · report
  if (t >= 16.8 && t < 19.7) {
    const sent = t > T.report + 0.05;
    const kf = E.io(p(t, T.report + 0.1, T.report + 0.45));
    S($('r-doc'), { o: 1 - p(t, T.report + 0.3, T.report + 0.45), s: L(1, 0.3, kf), rx: L(0, 30, kf), y: L(0, 10, kf) });

    S($('r-mars'), { rz: t * 4, z: -400, o: 1 });
    const kp = p(t, T.report + 0.35, T.report + 1.0);

    S($('r-ok'), { ...bio(t, T.report + 0.95, 1e9, 0.45, 20, 40), z: 160, s: L(0.7, 1, E.back(p(t, T.report + 0.95, T.report + 1.35))) });

  if (t >= 19.5 && t < 22.12) {

    $('s7bg').style.background = bi >= 0 ? BEATS[bi].c : t < 19.6 ? BEATS[0].c : '#FFF4EC';
    BEATS.forEach((b, i) => {
      const on = i === bi; const k = E.expo(p(t, b.t0, b.t0 + 0.35));
      S(b.w, on ? { o: 1, rx: L(-75, 0, k), s: L(1.35, 1, k), b: (1 - k) * 20, y: L(60, 0, k) } : { o: 0 });

  // ---------- 8 · end
  if (t >= 21.85) {

// ------------------------------------------------------------------ player
let t = 0, playing = !EXPORT, last = 0;
const holder = $('holder'), stage = $('stage'), scrub = $('scrub'), time = $('time'), playBtn = $('play');
scrub.max = D;
function fit() {
  if (EXPORT) { holder.style.width = '1080px'; holder.style.height = '1920px'; return; }
  const narrow = innerWidth <= 600;
  const k = Math.min((innerHeight - (narrow ? 70 : 130)) / 1920, (innerWidth - (narrow ? 0 : 32)) / 1080);
  stage.style.transform = `scale(${k})`; holder.style.width = 1080 * k + 'px'; holder.style.height = 1920 * k + 'px';
}
addEventListener('resize', fit); fit();
const PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
const PLAY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>';
function setPlaying(v) { playing = v; playBtn.innerHTML = v ? PAUSE : PLAY; playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play'); last = performance.now(); }
setPlaying(playing);
playBtn.onclick = () => setPlaying(!playing);
holder.onclick = () => setPlaying(!playing);
scrub.oninput = () => { t = +scrub.value; setPlaying(false); draw(); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.code === 'ArrowRight') { t = Math.min(D, t + (e.shiftKey ? 1 : 1 / 30)); draw(); }
  if (e.code === 'ArrowLeft') { t = Math.max(0, t - (e.shiftKey ? 1 : 1 / 30)); draw(); }
});
SCENES.forEach(s => { const b = document.createElement('button'); b.textContent = s.name; b.dataset.id = s.id; b.onclick = () => { t = s.id === 's0' ? 0 : s.a + 0.15; setPlaying(true); draw(); }; $('scenes').appendChild(b); });
function draw() {
  render(t); scrub.value = t; time.textContent = t.toFixed(2) + 's';
  const cur = [...SCENES].reverse().find(s => t >= s.a + 0.2) || SCENES[0];
  document.querySelectorAll('#scenes button').forEach(b => b.classList.toggle('on', b.dataset.id === cur.id));
}
function loop(now) { if (playing) { t += Math.min(0.05, (now - last) / 1000); if (t >= D) t = 0; } last = now; draw(); requestAnimationFrame(loop); }
window.D = D; window.render = render;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => (i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })))]);
if (EXPORT) render(0); else requestAnimationFrame(n => { last = n; loop(n); });
