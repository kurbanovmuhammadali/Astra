<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astra Splash</title>
<!--
  First-launch splash prototype (≈2 s), drawn in iPhone points (393×852).
  Darkness → a thin edge of Earth → a point of light runs along the limb → it becomes the Astra star exactly where
  the welcome screen's logo star sits → the welcome screen fades in under it and the star hands over to the real logo.
  Plays after the system launch screen, works offline, tap to skip. Export: node render.mjs --page splash.html --w 1179 --h 2556
-->
<style>
  :root { --ui-bg: #F3EEEA; --ui-fg: #2B1E18; --ui-card: #fff; --ui-line: #E4D9D2; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ui-bg: #0E0B0C; --ui-fg: #F1EAE6; --ui-card: #1E1714; --ui-line: #3A2E28; } }
  :root[data-theme="dark"] { --ui-bg: #0E0B0C; --ui-fg: #F1EAE6; --ui-card: #1E1714; --ui-line: #3A2E28; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--ui-bg); color: var(--ui-fg); font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; overflow: hidden; }
  body.export { background: #000; display: block; }
  #holder { position: relative; flex: none; overflow: hidden; border-radius: 46px; background: #000; box-shadow: 0 30px 70px -30px rgba(0,0,0,.6); cursor: pointer; }
  body.export #holder { border-radius: 0; box-shadow: none; }
  #stage { position: absolute; left: 0; top: 0; width: 393px; height: 852px; transform-origin: 0 0; background: #000; overflow: hidden; }
  .abs { position: absolute; }
  #hint { font-size: 13px; opacity: .7; }
  body.export #hint { display: none; }
</style>
</head>
<body>
<div id="holder"><div id="stage">
  <img id="welcome" class="abs" src="assets/app/welcome.png" alt="" style="left:0;top:0;width:393px;height:852px;opacity:0">
  <svg id="sky" class="abs" style="left:0;top:0;overflow:visible" width="393" height="852" viewBox="0 0 393 852">
    <defs>
      <radialGradient id="gDisc" gradientUnits="userSpaceOnUse" cx="-500" cy="900" r="1022">
        <stop offset=".95" stop-color="#010204"/><stop offset=".992" stop-color="#07142C"/><stop offset="1" stop-color="#15346A"/>
      </radialGradient>
      <linearGradient id="gLimb" gradientUnits="userSpaceOnUse" x1="393" y1="520" x2="20" y2="20">
        <stop offset="0" stop-color="#FFB27A"/><stop offset=".35" stop-color="#9FD0FF"/><stop offset="1" stop-color="#5FA8FF"/>
      </linearGradient>
      <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      <radialGradient id="gDot"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#FFE0C8"/><stop offset="1" stop-color="#FFB38A" stop-opacity="0"/></radialGradient>
      <radialGradient id="gSun"><stop offset="0" stop-color="#FFE7D2"/><stop offset=".25" stop-color="#FFB27A" stop-opacity=".8"/><stop offset="1" stop-color="#FF8A5B" stop-opacity="0"/></radialGradient>
      <linearGradient id="gStar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD9C0"/><stop offset=".5" stop-color="#E3A27E"/><stop offset="1" stop-color="#C98466"/></linearGradient>
    </defs>
    <g id="earth">
      <circle cx="-500" cy="900" r="1022" fill="url(#gDisc)"/>
      <path id="limbGlow" fill="none" stroke="#5FA8FF" stroke-width="10" opacity=".5" filter="url(#fGlow)"/>
      <path id="limb" fill="none" stroke="url(#gLimb)" stroke-width="1.6" stroke-linecap="round"/>
      <circle id="sunrise" r="40" fill="url(#gSun)" opacity=".85"/>
    </g>
    <g id="trail"></g>
    <circle id="dotGlow" r="16" fill="url(#gDot)"/>
    <circle id="dot" r="2.6" fill="#fff"/>
    <circle id="starGlow" r="14" fill="url(#gDot)"/>
    <path id="star" fill="url(#gStar)" stroke="#FFF1E6" stroke-width=".6" d="M12 1.5C12.9 8 16 11.1 22.5 12 16 12.9 12.9 16 12 22.5 11.1 16 8 12.9 1.5 12 8 11.1 11.1 8 12 1.5Z"/>
  </svg>
</div></div>
<div id="hint">Click the screen to replay · Space to pause</div>

<script>
const D = 2.6, W = 393, H = 852;
const EXPORT = new URLSearchParams(location.search).has('export');
if (EXPORT) document.body.classList.add('export');
const $ = id => document.getElementById(id);
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const p = (t, a, b) => cl((t - a) / (b - a));
const L = (a, b, k) => a + (b - a) * k;
const io = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

// Earth limb: a circle through the welcome screen's logo star (measured from the real app: centre 33, 28 pt)
const STAR = { x: 33, y: 27.9, size: 18 };
const C = { x: -500, y: 900 }, Rr = Math.hypot(STAR.x - C.x, STAR.y - C.y);
const ang = (x, y) => Math.atan2(y - C.y, x - C.x);
const A1 = ang(STAR.x, STAR.y);                                      // ends at the logo
const A0 = Math.acos((W + 12 - C.x) / Rr) * -1;                     // enters from the right edge
const at = a => [C.x + Math.cos(a) * Rr, C.y + Math.sin(a) * Rr];
const arcPath = (a, b, n = 80) => Array.from({ length: n + 1 }, (_, i) => at(L(a, b, i / n))).map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(2)},${q[1].toFixed(2)}`).join('');
const full = arcPath(A0 - 0.08, A1 - 0.12);
$('limb').setAttribute('d', full); $('limbGlow').setAttribute('d', full);
const TR = Array.from({ length: 14 }, (_, i) => { const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('fill', '#FFE3CC'); $('trail').appendChild(c); return c; });

function render(t) {
  // 1 · out of darkness, a thin edge of Earth
  const kE = out(p(t, 0.0, 0.45));
  $('earth').style.opacity = kE * (1 - p(t, 1.45, 1.95));
  $('earth').style.transform = `translate(${L(-14, 0, kE)}px, ${L(18, 0, kE)}px)`;
  const sr = at(A0 + 0.02);
  $('sunrise').setAttribute('cx', sr[0]); $('sunrise').setAttribute('cy', sr[1]); $('sunrise').setAttribute('r', L(14, 46, out(p(t, 0.1, 1.3))));

  // 2 · a point of light runs along the limb to the logo position
  const kd = io(p(t, 0.32, 1.18));
  const a = L(A0, A1, kd), [x, y] = at(a);
  const dOn = p(t, 0.32, 0.42) * (1 - p(t, 1.15, 1.25));
  $('dot').setAttribute('cx', x); $('dot').setAttribute('cy', y); $('dot').style.opacity = dOn;
  $('dotGlow').setAttribute('cx', x); $('dotGlow').setAttribute('cy', y); $('dotGlow').style.opacity = dOn;
  TR.forEach((c, i) => { const [tx, ty] = at(L(A0, A1, io(p(t - (i + 1) * 0.018, 0.32, 1.18)))); c.setAttribute('cx', tx); c.setAttribute('cy', ty); c.setAttribute('r', 2.2 * (1 - i / 14)); c.style.opacity = dOn * 0.55 * (1 - i / 14); });

  // 3 · it blooms into the Astra star, then settles at the logo's exact size
  const kb = p(t, 1.12, 1.62);
  const s = kb <= 0 ? 0 : L(0, 1, back(cl(kb * 1.25))) * L(1.9, 1, out(p(t, 1.3, 1.7)));
  const size = STAR.size * s, rot = L(-120, 0, out(kb));
  $('star').setAttribute('transform', `translate(${STAR.x} ${STAR.y}) rotate(${rot}) scale(${size / 24}) translate(-12 -12)`);
  $('star').style.opacity = p(t, 1.12, 1.2) * (1 - p(t, 1.95, 2.05));
  $('starGlow').setAttribute('cx', STAR.x); $('starGlow').setAttribute('cy', STAR.y);
  $('starGlow').style.opacity = Math.sin(Math.PI * p(t, 1.1, 1.55)) * 0.55;

  // 4 · the welcome screen fades in underneath; the star hands over to the real logo in the same place
  $('welcome').style.opacity = io(p(t, 1.45, 2.0));
  $('welcome').style.transform = `scale(${L(1.04, 1, out(p(t, 1.45, 2.3)))})`;
}

let t = 0, playing = !EXPORT, last = 0;
const holder = $('holder'), stage = $('stage');
function fit() {
  if (EXPORT) { const k = innerWidth / W; stage.style.transform = `scale(${k})`; holder.style.width = innerWidth + 'px'; holder.style.height = H * k + 'px'; return; }
  const k = Math.min((innerHeight - 60) / H, (innerWidth - 32) / W, 1.2);
  stage.style.transform = `scale(${k})`; holder.style.width = W * k + 'px'; holder.style.height = H * k + 'px';
}
addEventListener('resize', fit); fit();
holder.onclick = () => { t = t < 1.9 ? 2.0 : 0; playing = true; };                   // tap: skip (or replay)
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing = !playing; } });
function loop(now) { if (playing) { t += Math.min(0.05, (now - last) / 1000); if (t >= D + 0.8) t = 0; } last = now; render(Math.min(t, D)); requestAnimationFrame(loop); }
window.D = D; window.render = render;
window.ready = new Promise(r => { const i = $('welcome'); i.complete ? r(true) : (i.onload = () => r(true)); });
if (EXPORT) render(0); else requestAnimationFrame(n => { last = n; loop(n); });
</script>
</body>
</html>
